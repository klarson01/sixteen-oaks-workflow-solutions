[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[context.deploy-preview]
  command = "npm run build"

# Each route has its own HTML file. Netlify serves 404.html for unknown paths.
# Keep public/orbitdesk/ files at their current URLs; no catch-all SPA rewrite.

[functions]
  node_bundler = "esbuild"
[functions.site]
  included_files = [".build/template.html"]

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
